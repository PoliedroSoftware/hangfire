name: Release - Nextcloud droplet

on:
  push:
    branches: [release/v1.0.0]
  pull_request:
    branches: [release/v1.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: droplet-hangfire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore PoliedroHangFire.sln
      - run: dotnet build PoliedroHangFire.sln -c Release --no-restore
      - run: dotnet test PoliedroHangFire.sln -c Release --no-build --logger trx
      - run: python3 -m unittest discover -s deploy/ci -p 'test_*.py' -v
      - name: Publish and package without runtime secrets
        run: |
          dotnet publish PoliedroHangFire/PoliedroHangFire.csproj -c Release --no-restore -o "$RUNNER_TEMP/publish" -p:UseAppHost=false
          python3 deploy/ci/package.py "$RUNNER_TEMP/publish" release.tar.gz --component hangfire
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hangfire-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release/v1.0.0'
    needs: build
    runs-on: [self-hosted, linux, x64, poliedro-droplet-hangfire]
    timeout-minutes: 20
    environment:
      name: droplet
      url: https://hangfire.holdinglalabranza.com/hangfire
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hangfire-${{ github.sha }}
      - name: Deploy verified commit through restricted SSH
        env:
          DEPLOY_KEY: ${{ secrets.DROPLET_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/droplet-key"
          hosts="$RUNNER_TEMP/droplet-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          digest="$(sha256sum release.tar.gz | cut -d ' ' -f1)"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "root@$DROPLET_HOST" "deploy $GITHUB_SHA $digest" < release.tar.gz
